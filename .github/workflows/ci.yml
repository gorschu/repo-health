name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test and validate release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify documentation-only pull requests
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${PR_BASE_SHA:?Missing pull request base SHA}" "${PR_HEAD_SHA:?Missing pull request head SHA}"
          files=$(mktemp)
          trap 'rm -f "$files"' EXIT
          git diff --name-only --no-renames -z "$PR_BASE_SHA...$PR_HEAD_SHA" -- > "$files"
          docs_only=true
          while IFS= read -r -d '' path; do
            case "$path" in
              cmd/*|internal/*) docs_only=false; break ;;
              *.md) ;;
              *) docs_only=false; break ;;
            esac
          done < "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Skip checks for documentation-only changes
        if: steps.changes.outputs.docs_only == 'true'
        run: echo 'Documentation-only PR; tests and release builds are not needed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install tools from .mise.toml
        if: steps.changes.outputs.docs_only != 'true'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Run formatting, lint and native Go tests
        if: steps.changes.outputs.docs_only != 'true'
        run: task check
      - name: Build snapshot archives without publishing
        if: steps.changes.outputs.docs_only != 'true'
        run: task release:snapshot

  release:
    name: Publish release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools from .mise.toml
        id: tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ fromJSON(steps.tools.outputs.versions).goreleaser[0].version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
